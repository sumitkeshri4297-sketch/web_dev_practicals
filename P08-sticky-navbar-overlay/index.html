<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Sticky Nav &amp; Overlay
  </title>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body>
  <header class="navbar">
   <strong>
    My Portfolio
   </strong>
   <nav>
    <a href="#work">
     Work
    </a>
    <a href="#about">
     About
    </a>
   </nav>
  </header>
  <main>
   <section class="intro">
    <h1>
     CSS positioning
    </h1>
    <p>
     Scroll down to see the sticky navigation remain at the top.
    </p>
   </section>
   <section id="work">
    <h2>
     Featured work
    </h2>
    <article class="project">
     <img alt="Laptop on a desk" src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1000"/>
     <div class="overlay">
      <h3>
       Web project
      </h3>
      <p>
       Text layered over an image using absolute positioning.
      </p>
     </div>
    </article>
   </section>
   <section id="about">
    <h2>
     About
    </h2>
    <p>
     This section gives the page enough height to scroll.
    </p>
   </section>
  </main>
 </body>
</html>
